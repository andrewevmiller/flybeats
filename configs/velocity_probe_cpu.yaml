# The run that asks whether hit strength reaches the motor pool on *real*
# audio. The finding it is testing came from the synthetic click track at 10k
# nodes, so this changes exactly one variable -- the corpus -- and holds the
# subgraph tier fixed. Changing node count too would confound the answer and
# cost roughly triple on CPU.
#
#   python src/train.py --config configs/velocity_probe_cpu.yaml
#   python scripts/probe_velocity.py --checkpoint runs/velocity_probe_cpu/best.pt
#
# 256 clips rather than the 64 of v1_8piece_cpu: the README records 25 epochs
# on 64 clips ending with the loss still falling and onset F flat, which is a
# model limited by data, and a data-limited model is a poor place to ask
# whether a signal exists.
#
# The 256 are drummer1 only. max_files keeps the first N usable rows in
# info.csv order, and GMD's info.csv is ordered by drummer, so this is 256
# drummer1 clips -- 227 fills, 29 beats, 10 styles, 1.24 h -- out of a training
# split of 846 covering 9 drummers, 17 styles and 8.4 h. Every velocity_*_cpu
# config inherits it, and the Phase A' arms are compared on it, so it stays.
# A new config that wants the spread sets `data.subset: stratified`.
_base_: v1_8piece_cpu.yaml
name: velocity_probe_cpu
data:
  max_files: 256
train:
  epochs: 12

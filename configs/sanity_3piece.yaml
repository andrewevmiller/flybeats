# PLAN.md open question 3: confirm the rate model converges on a 3-piece task
# before investing in the surrogate-gradient spiking version.
_base_: v1_8piece.yaml
name: sanity_3piece
kit:
  tier: 3piece
  bilateral: false
subgraph:
  cache: data/cache/subgraph_10k_w5.npz
  max_nodes: 10000
  # NOTE: spectral_radius / spectral_radius_by_arm are inherited from
  # v1_8piece.yaml and were measured at the 30k tier. Operating points do not
  # transfer across tiers -- at one radius the motor pool's input gain differs
  # 13.8x between the 2k and 30k tiers -- and this config runs at 10k. The 10k
  # tier's own clean points have never been measured. Re-run
  # scripts/propagation.py against this config before treating the inherited
  # radii here as anything but a placeholder.
  min_weight: 5
data:
  synthetic: true
  n_clips: 128
  seconds: 2.0
train:
  epochs: 15
  batch_size: 8
  tbptt_steps: 100

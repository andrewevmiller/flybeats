<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flybeats scoring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Serif:wght@700&display=swap" rel="stylesheet">
<style>
/* Tokens from Andrew_Miller_Site_Design_Language.md (andrewevmiller.com) */
:root{
  --bg:#F2F1EE; --bg-soft:#E9E8E2; --panel:#E1E0D9; --line:#CBC9C1;
  --ink:#1C1C1A; --muted:#5C5B54; --accent:#B98FD6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171716; --bg-soft:#1E1E1C; --panel:#242422; --line:#3A3A35;
    --ink:#ECEBE5; --muted:#A3A29A; --accent:#B98FD6;
  }
}
:root[data-theme="dark"]{
  --bg:#171716; --bg-soft:#1E1E1C; --panel:#242422; --line:#3A3A35;
  --ink:#ECEBE5; --muted:#A3A29A; --accent:#B98FD6;
}
*{box-sizing:border-box}
body{
  margin:0; background-color:var(--bg); color:var(--ink);
  background-image:radial-gradient(var(--line) 1px, transparent 1px);
  background-size:26px 26px;
  font-family:"Geist", system-ui, sans-serif; font-size:17px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1140px; margin:0 auto; padding:clamp(64px,10vw,108px) 16px}
.measure{max-width:640px}
.mono{font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:0.85rem; color:var(--muted); letter-spacing:0.02em}
h1,h2{font-family:"IBM Plex Serif", Georgia, serif; font-weight:700; letter-spacing:-0.01em; margin:0}
h1{font-size:clamp(2.2rem,6vw,3.4rem); line-height:1.1}
h2{font-size:1.5rem; margin:0 0 12px}
.kicker{margin-bottom:10px}
.lede{color:var(--muted); margin:14px 0 0}
.rule{height:1px; background:var(--line); border:0; margin:36px 0}
table{width:100%; border-collapse:collapse}
th,td{padding:12px 0; border-bottom:1px solid var(--line); text-align:left; vertical-align:baseline}
th{font-family:"IBM Plex Mono", ui-monospace, monospace; font-weight:400; font-size:0.8rem; color:var(--muted); letter-spacing:0.04em; text-transform:uppercase}
td.num, th.num{text-align:right; font-variant-numeric:tabular-nums}
td.num{font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:0.95rem}
tr.best td{color:var(--ink)}
.empty{color:var(--muted); padding:24px 0}
.result{margin-top:28px; padding:20px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line)}
.result strong{font-family:"IBM Plex Serif", Georgia, serif; font-size:1.25rem; font-weight:700}
.result .verdict{color:var(--accent)}
.error{margin-top:20px; color:var(--ink); border-left:2px solid var(--accent); padding-left:12px}
a{color:var(--accent); text-decoration:none; border-bottom:1px solid var(--accent)}
a:hover{background:var(--accent); color:var(--bg)}
@media (max-width:560px){
  body{font-size:16px}
  th,td{padding:10px 0}
  th.hide-sm,td.hide-sm{display:none}
}
</style>
</head>
<body>
<main class="wrap">
  <div class="mono kicker">Flybeats / scoring</div>
  <h1 id="title">Scoring</h1>
  <p class="mono" id="status" style="margin-top:14px">Loading</p>

  <hr class="rule">

  <div class="measure">
    <h2>Networks</h2>
    <p class="lede" id="intro">Beat alignment for each network, on the scoring split. Higher is better.</p>
  </div>
  <table style="margin-top:20px">
    <thead><tr id="head"><th>Network</th></tr></thead>
    <tbody id="rows"><tr><td class="empty">Waiting for the first network to finish.</td></tr></tbody>
  </table>
  <p class="mono" id="refresh" style="margin-top:10px"></p>

  <div id="result"></div>
  <div id="machine"></div>
  <div id="error"></div>

  <hr class="rule">
  <p class="mono" id="updated"></p>
</main>

<script>
function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function num(x,d){return (x===null||x===undefined||isNaN(Number(x)))?'-':Number(x).toFixed(d);}
const LABELS={step:'Step',beat_alignment:'Beat alignment',songs:'Songs',threshold:'Threshold',hits_mean:'Hits per song',
  balance_mean:'Balance',timing_without_b:'Timing (no balance)'};
function cols(nets){
  const keys=[];
  Object.values(nets).forEach(v=>Object.keys(v).forEach(k=>{if(!keys.includes(k)) keys.push(k);}));
  return keys;
}
function render(d){
   const entries=Object.entries(d.networks||{});
   const keys=cols(d.networks||{});
   document.getElementById('head').innerHTML='<th>Network</th>'+keys.map(k=>'<th class="num">'+esc(LABELS[k]||k)+'</th>').join('');
   if(entries.length){
     const best=Math.max(...entries.map(([,v])=>Number(v.beat_alignment)));
     document.getElementById('rows').innerHTML=entries.map(([n,v])=>{
       const cls=Number(v.beat_alignment)===best?' class="best"':'';
       return '<tr'+cls+'><td>'+esc(n)+'</td>'+keys.map(k=>{
         const x=v[k];
         const txt=(typeof x==='number')?(k==='step'||k==='songs'?esc(x):x.toFixed(k==='timing_without_b'?4:3)):esc(x===undefined?'-':x);
         return '<td class="num">'+txt+'</td>';}).join('')+'</tr>';
     }).join('');
   }
}
function renderMachine(m){
  const el=document.getElementById('machine');
  if(!m){el.innerHTML='';return;}
  const rows=[
    ['GPU', m.gpu_name],
    ['GPU use (whole card)', m.gpu_usage_pct, '%'],
    ['GPU temperature', m.gpu_temp_c, ' °C'],
    ['GPU power', m.gpu_power_w, ' W'],
    ['GPU clock', m.gpu_clock_mhz, ' MHz'],
    ['GPU memory used', m.gpu_mem_used_mb!=null && m.gpu_mem_total_mb!=null ? (m.gpu_mem_used_mb+' / '+m.gpu_mem_total_mb) : null, ' MB'],
    ['CPU use (whole machine)', m.cpu_usage_pct, '%'],
    ['CPU temperature (board sensor)', m.cpu_temp_c, ' °C'],
    ['CPU power', m.cpu_power_w, ' W'],
    ['This scoring run: CPU share', m.run_cpu_pct, '%'],
    ['This scoring run: GPU share', m.run_gpu_pct, '%'],
    ['This scoring run: RAM', m.run_ram_mb, ' MB'],
    ['This scoring run: GPU memory', m.run_gpu_mem_mb, ' MB']
  ];
  const body=rows.filter(r=>r[1]!==null && r[1]!==undefined).map(r=>{
    const v=(typeof r[1]==='number')?(Number.isInteger(r[1])?r[1]:r[1].toFixed(1)):esc(r[1]);
    return '<tr><td>'+esc(r[0])+'</td><td class="num">'+v+(r[2]?esc(r[2]):'')+'</td></tr>';
  }).join('');
  el.innerHTML='<div class="result"><div class="mono kicker">Computer, read '+esc(m.reading_taken||'-')+'</div>'+
    '<table><tbody>'+body+'</tbody></table></div>';
}

let lastStamp='';
function load(){
fetch('score.json?'+Date.now(),{cache:'no-store'})
 .then(r=>{if(!r.ok) throw new Error('HTTP '+r.status); return r.json();})
 .then(d=>{
   const stamp=JSON.stringify(d);
   document.getElementById('refresh').textContent='Refreshes every 30 s · last checked '+new Date().toLocaleTimeString();
   if(stamp===lastStamp) return;
   lastStamp=stamp;
   document.title='Flybeats scoring';
   document.getElementById('title').textContent=d.title||'Scoring';
   document.getElementById('status').textContent='Status: '+(d.status||'unknown');
   document.getElementById('updated').textContent='Updated '+(d.updated||'-');

   render(d);
   renderMachine(d.machine);

   if(d.main_win){
     const w=d.main_win;
     document.getElementById('result').innerHTML=
       '<div class="result"><div class="mono kicker">Main win rule</div>'+
       '<strong>'+(w.wins?'Met':'Not met')+'</strong> <span class="verdict mono">'+(w.wins?'real network wins':'no win')+'</span>'+
       '<p class="mono" style="margin:12px 0 0">real '+num(w.real,3)+' · best control '+num(w.best_control,3)+' · spread '+num(w.seed_spread,3)+' · margin '+num(w.margin,3)+'</p></div>';
   }
   if(d.error){
     document.getElementById('error').innerHTML='<p class="error mono">Error: '+esc(d.error)+'</p>';
   }
 })
 .catch(()=>{document.getElementById('status').textContent='Scoring data not available yet.';});
}
load();
setInterval(load, 30000);
</script>
</body>
</html>
